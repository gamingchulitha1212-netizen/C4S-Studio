const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// "1500" or "1500.50" -> cents (integer). Returns null if it is not a valid money amount.
function toCents(v) {
  const s = String(v == null ? '' : v).trim().replace(/,/g, '');
  if (!/^\d{1,9}(\.\d{1,2})?$/.test(s)) return null;
  const parts = s.split('.');
  return parseInt(parts[0], 10) * 100 + parseInt(((parts[1] || '') + '00').slice(0, 2), 10);
}
function money(c, cur) {
  const neg = c < 0; c = Math.abs(c);

  return (neg ? '-' : '') + cur + whole + '.' + String(c % 100).padStart(2, '0');

// Builds the invoice numbers from the form values. Everything is in whole cents, so there are no rounding errors.
function computeInvoice(draft) {
  const items = [];
  for (let i = 0; i < draft.items.length; i++) {
    const r = draft.items[i];
    const d = (r.d || '').trim(), q = String(r.q || '').trim(), p = String(r.p || '').trim();
    if (!d && !q && !p) continue;
    const n = i + 1;
    if (!d) return { ok: false, error: 'Item ' + n + ': description is required.' };
    if (d.length > 200) return { ok: false, error: 'Item ' + n + ': description is too long (max 200).' };
    if (!/^\d{1,4}$/.test(q) || parseInt(q, 10) < 1) return { ok: false, error: 'Item ' + n + ': quantity must be a whole number, 1 or more.' };
    const unit = toCents(p);
    if (unit === null || unit <= 0) return { ok: false, error: 'Item ' + n + ': price must be a number above 0 (up to 2 decimals), e.g. 1500 or 1500.50.' };
    const qty = parseInt(q, 10);
    items.push({ description: d, qty: qty, unitCents: unit, lineCents: qty * unit });
  }
  if (!items.length) return { ok: false, error: 'Add at least one item (description, quantity and price).' };
  if (items.length > 50) return { ok: false, error: 'Maximum 50 items per invoice.' };
  const subtotal = items.reduce((a, it) => a + it.lineCents, 0);
  if (!Number.isSafeInteger(subtotal) || subtotal > 100000000000) return { ok: false, error: 'The total is too large.' };
  let discount = 0;
  if (String(draft.discount || '').trim() !== '') {
    discount = toCents(draft.discount);
    if (discount === null) return { ok: false, error: 'Discount must be a number (up to 2 decimals).' };
    if (discount > subtotal) return { ok: false, error: 'Discount cannot be more than the subtotal.' };
  }
  let taxBp = 0;
  const tp = String(draft.tax || '').trim();
  if (tp !== '') {
    if (!/^\d{1,3}(\.\d{1,2})?$/.test(tp) || parseFloat(tp) > 100) return { ok: false, error: 'Tax % must be a number from 0 to 100.' };
    taxBp = Math.round(parseFloat(tp) * 100);
  }
  const due = String(draft.due || '').trim();
  if (!/^\d{1,3}$/.test(due) || parseInt(due, 10) > 365) return { ok: false, error: 'Due days must be a whole number from 0 to 365.' };
  const base = subtotal - discount;
  const taxCents = Math.round(base * taxBp / 10000);
  return { ok: true, items: items, subtotal: subtotal, discount: discount, taxBp: taxBp, taxCents: taxCents, total: base + taxCents, dueDays: parseInt(due, 10) };
}
// Second, independent check of every number. Throws if anything does not add up.
function verifyCalc(c, shownTotalText, cur) {
  let sum = 0;
  c.items.forEach((it, i) => {
    if (!(it.qty >= 1) || !(it.unitCents > 0)) throw new Error('Item ' + (i + 1) + ' has an invalid quantity or price.');
    if (it.lineCents !== it.qty * it.unitCents) throw new Error('Item ' + (i + 1) + ' line total does not match quantity x price.');
    sum += it.lineCents;
  });
  if (sum !== c.subtotal) throw new Error('Subtotal does not match the sum of the items.');
  if (c.discount < 0 || c.discount > c.subtotal) throw new Error('Discount is out of range.');
  const expectTax = Math.round((c.subtotal - c.discount) * c.taxBp / 10000);
  if (expectTax !== c.taxCents) throw new Error('Tax amount does not match the tax %.');
  if (c.subtotal - c.discount + c.taxCents !== c.total) throw new Error('Grand total does not add up.');
  if (!(c.total > 0)) throw new Error('Grand total must be above 0.');
  if (shownTotalText != null && shownTotalText !== money(c.total, cur)) throw new Error('The total shown on screen (' + shownTotalText + ') differs from the calculated total (' + money(c.total, cur) + ').');

}

async function sendInvoiceEmail(id, inv) {
  const c = (window.C4S_INVOICE_CONFIG && window.C4S_INVOICE_CONFIG.emailjs) || {};
  try {
    if (!c.publicKey || !c.serviceId || !c.templateId) throw new Error('Email is not set up yet. Fill in invoice-config.js (EmailJS keys).');
    if (!window.emailjs) throw new Error('The email library did not load. Check your internet connection.');
    if (!emailOk(inv.customerEmail)) throw new Error('The customer email address is not valid.');
    const bn = (inv.business && inv.business.name) || 'C4S Studio';
    await window.emailjs.send(c.serviceId, c.templateId, {
      to_email: inv.customerEmail, to_name: inv.customerName || '', invoice_number: inv.number, business_name: bn,
      total_text: money(inv.totalCents, inv.currency || '$'), subject: 'Invoice ' + inv.number + ' from ' + bn, invoice_html: invoiceHTML(inv)
    }, { publicKey: c.publicKey });
    await update(ref(db, 'invoices/' + id), { emailStatus: 'sent', emailSentAt: serverTimestamp(), emailError: null });
  } catch (e) {
    const m = String((e && (e.text || e.message)) || 'Unknown error').slice(0, 280);
    try { await update(ref(db, 'invoices/' + id), { emailStatus: 'failed', emailError: m }); } catch (x) {}
    throw new Error(m);

}

  const now = new Date(), due = new Date(now.getTime() + c.dueDays * 86400000);
  const inv = {
    number: number, orderId: order.id, customerName: (order.name || '').slice(0, 100), customerEmail: (order.email || '').slice(0, 150),
    items: c.items, subtotalCents: c.subtotal, discountCents: c.discount, taxBp: c.taxBp, taxCents: c.taxCents, totalCents: c.total,
    currency: bizCur(), issueDate: ymd(now), dueDate: ymd(due), status: 'issued', emailStatus: 'not_sent', createdAt: serverTimestamp(),
    business: { name: String(biz.businessName || 'C4S Studio').slice(0, 600), address: String(biz.address || '').slice(0, 600), phone: String(biz.phone || '').slice(0, 600), email: String(biz.email || '').slice(0, 600), payment: String(biz.payment || '').slice(0, 600), footer: String(biz.footer || '').slice(0, 600) }
  };
  if (order.phone) inv.customerPhone = String(order.phone).slice(0, 40);
  if (c.notes) inv.notes = c.notes.slice(0, 1000);
  const updates = {};
  updates['invoices/' + id] = inv;
  updates['invoiceNumbers/' + number] = id;
  updates['orderInvoice/' + order.id] = id;
  try { await update(ref(db), updates); }
  catch (e) { throw new Error('The invoice was blocked: ' + e.message + ' (a duplicate is refused, or the invoice rules are not published yet)'); }
  const saved = Object.assign({}, inv, { createdAt: Date.now() });
  return { id: id, inv: saved };
}

function draftFor(o) {
  if (!drafts.has(o.id)) {
    const m = /Estimated Total:\s*\D*?([\d,]+(?:\.\d{1,2})?)/i.exec(o.message || '');
    drafts.set(o.id, { items: [{ d: o.service || '', q: '1', p: m ? m[1].replace(/,/g, '') : '' }], discount: '', tax: String(biz.taxPercent || '0'), due: String(biz.dueDays || '7'), notes: '' });
  }
  return drafts.get(o.id);
}

function printInvoice(inv) {
  const doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(inv.number) + '</title></head><body style="margin:0;padding:20px">' + invoiceHTML(inv) + '</body></html>';
  const url = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
  const w = window.open(url, '_blank');
  if (w) w.addEventListener('load', () => { w.focus(); w.print(); });
}

function invoicePanel(o) {
  const wrap = h('div', 'inv');
  wrap.appendChild(h('h4', null, 'Invoice'));
  const msg = h('span', 'msg');
  const mine = invoices.filter((i) => i.orderId === o.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const active = mine.find((i) => i.status !== 'void');

  if (active) {
    const cur = active.currency || '$';
    wrap.appendChild(h('div', 'msg', active.number + '  |  ' + ({ issued: 'Issued', paid: 'Paid', void: 'Void' }[active.status] || active.status) + '  |  Total ' + money(active.totalCents, cur) + '  |  Email: ' + (active.emailStatus === 'sent' ? 'sent to ' + active.customerEmail : active.emailStatus === 'failed' ? 'FAILED (' + (active.emailError || 'error') + ')' : 'not sent yet')));
    const row = h('div', 'row');
    const mkBtn = (label, cls, fn) => { const b = h('button', cls || '', label); b.type = 'button'; b.onclick = fn; row.appendChild(b); return b; };
    mkBtn(active.emailStatus === 'sent' ? 'Resend email' : 'Send email', 'primary', async () => {
      if (!confirm('Email invoice ' + active.number + ' (' + money(active.totalCents, cur) + ') to ' + active.customerEmail + '?')) return;
      msg.className = 'msg'; msg.textContent = 'Sending...';
      try { await sendInvoiceEmail(active.id, active); msg.textContent = 'Email sent.'; } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    });
    mkBtn('Print / PDF', '', () => printInvoice(active));
    if (active.status === 'issued') mkBtn('Mark paid', '', async () => { try { await update(ref(db, 'invoices/' + active.id), { status: 'paid' }); } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; } });
    mkBtn('Void', 'del', async () => {
      if (!confirm('Void invoice ' + active.number + '? The number is never reused. You can then create a new invoice for this order.')) return;
      try { await update(ref(db, 'invoices/' + active.id), { status: 'void' }); } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    });
    row.appendChild(msg);
    wrap.appendChild(row);
    return wrap;
  }

  if (mine.length) wrap.appendChild(h('div', 'msg', 'Previous invoice ' + mine[0].number + ' was voided.'));
  if (!builderOpen.has(o.id)) {
    const b = h('button', 'primary', 'Create invoice'); b.type = 'button'; b.style.marginTop = '6px';
    b.onclick = () => { builderOpen.add(o.id); render(); };
    wrap.appendChild(b);
    return wrap;
  }

  const d = draftFor(o), cur = bizCur();
  const list = h('div');
  const totals = h('div', 'totals');
  const refresh = () => {
    totals.textContent = '';
    const c = computeInvoice(d);
    if (!c.ok) { totals.appendChild(h('div', 'msg', c.error)); return null; }
    const line = (a, b, cls) => { const r = h('div', cls || ''); r.appendChild(h('span', null, a)); r.appendChild(h('span', null, b)); totals.appendChild(r); };
    line('Subtotal', money(c.subtotal, cur));
    if (c.discount) line('Discount', '-' + money(c.discount, cur));
    if (c.taxBp) line('Tax (' + (c.taxBp / 100) + '%)', money(c.taxCents, cur));
    line('Total', money(c.total, cur), 'grand');
    return c;
  };
  const drawItems = () => {
    list.textContent = '';
    d.items.forEach((r, i) => {
      const row = h('div', 'irow');
      const mk = (ph, key, mode) => { const x = h('input'); x.type = 'text'; x.placeholder = ph; x.value = r[key]; if (mode) x.inputMode = mode; x.oninput = () => { r[key] = x.value; refresh(); }; row.appendChild(x); };
      mk('Item / service', 'd'); mk('Qty', 'q', 'numeric'); mk('Unit price', 'p', 'decimal');
      const rm = h('button', 'small del', 'Remove'); rm.type = 'button';
      rm.onclick = () => { d.items.splice(i, 1); if (!d.items.length) d.items.push({ d: '', q: '1', p: '' }); drawItems(); refresh(); };
      row.appendChild(rm); list.appendChild(row);
    });
  };
  drawItems();
  const add = h('button', 'small', '+ Add item'); add.type = 'button'; add.style.marginTop = '8px';
  add.onclick = () => { d.items.push({ d: '', q: '1', p: '' }); drawItems(); };
  const opts = h('div', 'iopts');
  const opt = (label, key, ph) => { const w = h('div'); w.appendChild(h('label', null, label)); const x = h('input'); x.type = 'text'; x.value = d[key]; x.placeholder = ph || ''; x.oninput = () => { d[key] = x.value; refresh(); }; w.appendChild(x); opts.appendChild(w); };
  opt('Discount (' + cur + ')', 'discount', '0'); opt('Tax %', 'tax', '0'); opt('Due in (days)', 'due', '7');
  const notes = h('textarea'); notes.placeholder = 'Notes on the invoice (optional)'; notes.maxLength = 1000; notes.value = d.notes; notes.style.marginTop = '10px';
  notes.oninput = () => { d.notes = notes.value; };
  wrap.appendChild(list); wrap.appendChild(add); wrap.appendChild(opts); wrap.appendChild(notes); wrap.appendChild(totals);
  refresh();

  const go = async (send) => {
    if (busy.has(o.id)) return;
    msg.className = 'msg err';
    if (send && !emailOk(o.email)) { msg.textContent = 'The customer email address is not valid.'; return; }
    const c = computeInvoice(d);
    if (!c.ok) { msg.textContent = c.error; return; }
    c.notes = (d.notes || '').trim();
    try { verifyCalc(c, totals.querySelector('.grand span:last-child') && totals.querySelector('.grand span:last-child').textContent, cur); }
    catch (e) { msg.textContent = 'Check failed: ' + e.message; return; }
    if (!confirm('Create this invoice?\n\nCustomer: ' + o.name + '\nTotal: ' + money(c.total, cur) + '\n' + (send ? 'It will be emailed to: ' + o.email : 'No email will be sent.'))) return;
    busy.add(o.id);
    msg.className = 'msg'; msg.textContent = 'Creating invoice...';
    try {
      const made = await createInvoice(o, c);
      builderOpen.delete(o.id); drafts.delete(o.id);
      if (send) {
        try { await sendInvoiceEmail(made.id, made.inv); alert('Invoice ' + made.inv.number + ' created and emailed to ' + o.email + '.'); }
        catch (e) { alert('Invoice ' + made.inv.number + ' was created, but the email failed:\n' + e.message + '\n\nYou can use "Send email" on the invoice again.'); }
      } else alert('Invoice ' + made.inv.number + ' created.');
    } catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
    finally { busy.delete(o.id); }
  };
  const row = h('div', 'row');
  const b1 = h('button', 'primary', 'Create invoice & email it'); b1.type = 'button'; b1.onclick = () => go(true);
  const b2 = h('button', null, 'Create only'); b2.type = 'button'; b2.onclick = () => go(false);
  const b3 = h('button', 'del', 'Cancel'); b3.type = 'button'; b3.onclick = () => { builderOpen.delete(o.id); render(); };
  [b1, b2, b3, msg].forEach((x) => row.appendChild(x));
  wrap.appendChild(row);
  return wrap;
}

function startListening() {
  if (listening) return;
  listening = true;
  loadBiz().then(render);
  onValue(ref(db, 'invoices'), (snap) => {
    invoices = [];
    snap.forEach((c) => { invoices.push({ id: c.key, ...c.val() }); });
    render();
  }, (err) => { console.warn('Invoices not readable yet:', err.message); });
  onValue(ref(db, 'orders'), snap => {
    orders = [];
    snap.forEach(c => { orders.push({ id: c.key, ...c.val() }); });
    orders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    render();
  }, err => {
    $('#list').innerHTML = '';
    $('#list').appendChild(h('div', 'card msg err', 'Could not load orders: ' + err.message + ' (Publish the "orders" database rules from the admin Database Rules box.)'));
  });
}

$('#q').addEventListener('input', e => { query = e.target.value; render(); });
$('#csv').onclick = () => {
  const cols = ['createdAt', 'status', 'name', 'email', 'phone', 'service', 'budget', 'eventDate', 'source', 'message', 'note'];
  const cell = (v) => {
    let s = String(v == null ? '' : v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  };
  const rows = [cols.join(',')].concat(orders.map(o => cols.map(c => cell(c === 'createdAt' ? (o.createdAt ? new Date(o.createdAt).toISOString() : '') : o[c])).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' }));
  a.download = 'c4s-orders.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};
$('#logout').onclick = (e) => { e.preventDefault(); signOut(auth); };
window.login = async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { gate.textContent = e.message; } };

onAuthStateChanged(auth, u => {
  $('#logout').classList.toggle('hidden', !u);
  if (!u) {
    $('#app').classList.add('hidden'); gate.classList.remove('hidden');
    gate.innerHTML = 'Please sign in with the admin account. <button class="primary" onclick="login()">Sign in with Google</button>';
  } else if (u.emailVerified && ADMIN_EMAILS.includes((u.email || '').toLowerCase())) {
    gate.classList.add('hidden'); $('#app').classList.remove('hidden'); startListening();
  } else {
    $('#app').classList.add('hidden'); gate.classList.remove('hidden');
    gate.textContent = "This account isn't authorized for admin access.";
  }
});
</script>
